version: "3.8"

services:
  db:
    image: postgres:16
    container_name: bot_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: bot_app
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    command: python bot.py

volumes:
  postgres_data: